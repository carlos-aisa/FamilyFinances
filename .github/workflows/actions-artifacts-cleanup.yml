name: Cleanup Actions Artifacts

on:
  schedule:
    - cron: "30 4 * * *"
  workflow_dispatch:
    inputs:
      keep_days:
        description: Keep artifacts from the last N days
        required: true
        default: "3"

jobs:
  cleanup-artifacts:
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: read

    steps:
      - name: Delete old Actions artifacts
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const rawKeepDays = Number.parseInt("${{ github.event.inputs.keep_days || '3' }}", 10);
            const keepDays = Number.isFinite(rawKeepDays) && rawKeepDays >= 0 ? rawKeepDays : 3;
            const cutoffMs = Date.now() - keepDays * 24 * 60 * 60 * 1000;

            const artifacts = await github.paginate(github.rest.actions.listArtifactsForRepo, {
              owner,
              repo,
              per_page: 100
            });

            let deleted = 0;
            let kept = 0;

            for (const artifact of artifacts) {
              const createdMs = new Date(artifact.created_at).getTime();
              const shouldDelete = artifact.expired || createdMs < cutoffMs;

              if (!shouldDelete) {
                kept += 1;
                continue;
              }

              await github.rest.actions.deleteArtifact({
                owner,
                repo,
                artifact_id: artifact.id
              });
              deleted += 1;
              console.log(`Deleted artifact '${artifact.name}' (${artifact.id}).`);
            }

            console.log(`Actions artifact cleanup complete. keep_days=${keepDays}, deleted=${deleted}, kept=${kept}, total=${artifacts.length}.`);
