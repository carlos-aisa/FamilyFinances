name: Release Windows Distribution

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      keep_count:
        description: Number of most recent releases whose ZIP assets should be kept
        required: true
        default: "2"

jobs:
  cleanup-release-zips-manual:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Cleanup old release ZIP assets (manual run)
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const rawKeepCount = Number.parseInt("${{ github.event.inputs.keep_count || '2' }}", 10);
            const keepCount = Number.isFinite(rawKeepCount) && rawKeepCount >= 0 ? rawKeepCount : 2;
            const zipAssetPattern = /^FamilyFinances-v.*-win-x64\.zip$/i;

            const releases = await github.paginate(github.rest.repos.listReleases, {
              owner,
              repo,
              per_page: 100
            });

            const orderedReleases = releases
              .filter(r => !r.draft)
              .sort((a, b) => {
                const aDate = new Date(a.published_at || a.created_at).getTime();
                const bDate = new Date(b.published_at || b.created_at).getTime();
                return bDate - aDate;
              });

            const releasesToClean = orderedReleases.slice(keepCount);
            let deletedAssets = 0;

            for (const release of releasesToClean) {
              for (const asset of release.assets || []) {
                if (!zipAssetPattern.test(asset.name)) {
                  continue;
                }

                await github.rest.repos.deleteReleaseAsset({
                  owner,
                  repo,
                  asset_id: asset.id
                });
                deletedAssets += 1;
                console.log(`Deleted '${asset.name}' from release '${release.tag_name}'.`);
              }
            }

            console.log(`Manual cleanup complete. keep_count=${keepCount}. ZIP assets deleted: ${deletedAssets}.`);

  release-windows:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "9.0.x"

      - name: Pre-clean old release ZIP assets (keep latest 2)
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const keepCount = 2;
            const zipAssetPattern = /^FamilyFinances-v.*-win-x64\.zip$/i;

            const releases = await github.paginate(github.rest.repos.listReleases, {
              owner,
              repo,
              per_page: 100
            });

            const orderedReleases = releases
              .filter(r => !r.draft)
              .sort((a, b) => {
                const aDate = new Date(a.published_at || a.created_at).getTime();
                const bDate = new Date(b.published_at || b.created_at).getTime();
                return bDate - aDate;
              });

            const releasesToClean = orderedReleases.slice(keepCount);
            let deletedAssets = 0;

            for (const release of releasesToClean) {
              for (const asset of release.assets || []) {
                if (!zipAssetPattern.test(asset.name)) {
                  continue;
                }

                await github.rest.repos.deleteReleaseAsset({
                  owner,
                  repo,
                  asset_id: asset.id
                });
                deletedAssets += 1;
                console.log(`Deleted '${asset.name}' from release '${release.tag_name}'.`);
              }
            }

            console.log(`Pre-clean complete. ZIP assets deleted: ${deletedAssets}.`);

      - name: Extract version from tag
        id: get_version
        shell: pwsh
        run: |
          $refName = "${{ github.ref_name }}"
          if ($refName -notmatch "^v(.*)$") {
            throw "Expected semantic tag starting with 'v', got '$refName'."
          }

          $version = $matches[1]
          $tagName = $refName

          echo "VERSION=$version" >> $env:GITHUB_OUTPUT
          echo "TAG_NAME=$tagName" >> $env:GITHUB_OUTPUT
          echo "Building version: $version"

      - name: Restore dependencies
        run: dotnet restore

      - name: Build
        run: dotnet build --configuration Release --no-restore

      - name: Critical Reporting Gate - API Integration
        run: dotnet test tests/FamilyFinances.Api.IntegrationTests/FamilyFinances.Api.IntegrationTests.csproj --configuration Release --no-build --filter "FullyQualifiedName~Reporting"

      - name: Critical Reporting Gate - Web Reports
        run: dotnet test tests/FamilyFinances.Web.Tests/FamilyFinances.Web.Tests.csproj --configuration Release --no-build --filter "FullyQualifiedName~Reports"

      - name: Critical Reporting Gate - Application Reporting
        run: dotnet test tests/FamilyFinances.Application.Tests/FamilyFinances.Application.Tests.csproj --configuration Release --no-build --filter "FullyQualifiedName~Reporting"

      - name: Build distribution (shared runtime layout)
        id: build_dist
        shell: pwsh
        run: |
          $version = "${{ steps.get_version.outputs.VERSION }}"
          ./build-windows-dist.ps1 -Version $version -Configuration Release
          $distDir = "dist/FamilyFinances-v$version-win-x64"
          $zipPath = "dist/FamilyFinances-v$version-win-x64.zip"
          echo "DIST_DIR=$distDir" >> $env:GITHUB_OUTPUT
          echo "ZIP_PATH=$zipPath" >> $env:GITHUB_OUTPUT

      - name: Verify distribution contents
        shell: pwsh
        run: |
          $distDir = "${{ steps.build_dist.outputs.DIST_DIR }}"

          $requiredFiles = @(
            "$distDir/Start FamilyFinances.bat",
            "$distDir/Stop FamilyFinances.bat",
            "$distDir/README.txt",
            "$distDir/FamilyFinances.Api.exe",
            "$distDir/FamilyFinances.Web.exe",
            "$distDir/FamilyFinances.Api.deps.json",
            "$distDir/FamilyFinances.Web.deps.json",
            "$distDir/FamilyFinances.Api.runtimeconfig.json",
            "$distDir/FamilyFinances.Web.runtimeconfig.json",
            "$distDir/config/api/appsettings.json",
            "$distDir/config/api/appsettings.Production.json",
            "$distDir/config/web/appsettings.json",
            "$distDir/config/web/appsettings.Production.json"
          )

          $requiredDirs = @(
            "$distDir/data",
            "$distDir/logs",
            "$distDir/config",
            "$distDir/config/api",
            "$distDir/config/web",
            "$distDir/wwwroot"
          )

          $missing = @()
          foreach ($file in $requiredFiles) {
            if (-not (Test-Path $file)) {
              $missing += $file
            }
          }

          foreach ($dir in $requiredDirs) {
            if (-not (Test-Path $dir)) {
              $missing += $dir
            }
          }

          if ($missing.Count -gt 0) {
            Write-Host "ERROR: Missing required distribution entries:" -ForegroundColor Red
            $missing | ForEach-Object { Write-Host "  - $_" -ForegroundColor Red }
            exit 1
          }

          Write-Host "All required files present!" -ForegroundColor Green

      - name: Smoke test Start/Stop scripts from ZIP
        shell: pwsh
        run: |
          $zipPath = "${{ steps.build_dist.outputs.ZIP_PATH }}"
          ./tools/dist/smoke-windows-dist.ps1 -ZipPath $zipPath

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: FamilyFinances-v${{ steps.get_version.outputs.VERSION }}-win-x64
          path: ${{ steps.build_dist.outputs.ZIP_PATH }}
          retention-days: 3

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ steps.get_version.outputs.TAG_NAME }}
          files: ${{ steps.build_dist.outputs.ZIP_PATH }}
          fail_on_unmatched_files: true
          draft: false
          prerelease: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

