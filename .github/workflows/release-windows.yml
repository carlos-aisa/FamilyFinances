name: Release Windows Distribution

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      keep_count:
        description: Number of most recent releases whose managed installer assets should be kept
        required: true
        default: "2"

jobs:
  cleanup-release-assets-manual:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Cleanup old managed installer assets (manual run)
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const rawKeepCount = Number.parseInt("${{ github.event.inputs.keep_count || '2' }}", 10);
            const keepCount = Number.isFinite(rawKeepCount) && rawKeepCount >= 0 ? rawKeepCount : 2;
            const patterns = [
              /^FamilyFinances-v.*-win-x64-setup\.exe$/i,
              /^FamilyFinances-v.*-win-x64\.msi$/i,
              /^FamilyFinances-v.*-win-x64-installer\.zip$/i,
              /^FamilyFinances-v.*-win-x64\.zip$/i
            ];

            const releases = await github.paginate(github.rest.repos.listReleases, {
              owner,
              repo,
              per_page: 100
            });

            const orderedReleases = releases
              .filter(r => !r.draft)
              .sort((a, b) => {
                const aDate = new Date(a.published_at || a.created_at).getTime();
                const bDate = new Date(b.published_at || b.created_at).getTime();
                return bDate - aDate;
              });

            const releasesToClean = orderedReleases.slice(keepCount);
            let deletedAssets = 0;

            for (const release of releasesToClean) {
              for (const asset of release.assets || []) {
                const isManagedAsset = patterns.some(pattern => pattern.test(asset.name));
                if (!isManagedAsset) {
                  continue;
                }

                await github.rest.repos.deleteReleaseAsset({
                  owner,
                  repo,
                  asset_id: asset.id
                });
                deletedAssets += 1;
                console.log(`Deleted '${asset.name}' from release '${release.tag_name}'.`);
              }
            }

            console.log(`Manual cleanup complete. keep_count=${keepCount}. Assets deleted: ${deletedAssets}.`);

  release-windows:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: windows-latest
    concurrency:
      group: release-windows-main
      cancel-in-progress: false
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "9.0.x"

      - name: Pre-clean old release assets (keep latest 2)
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const keepCount = 2;
            const patterns = [
              /^FamilyFinances-v.*-win-x64-setup\.exe$/i,
              /^FamilyFinances-v.*-win-x64\.msi$/i,
              /^FamilyFinances-v.*-win-x64-installer\.zip$/i,
              /^FamilyFinances-v.*-win-x64\.zip$/i
            ];

            const releases = await github.paginate(github.rest.repos.listReleases, {
              owner,
              repo,
              per_page: 100
            });

            const orderedReleases = releases
              .filter(r => !r.draft)
              .sort((a, b) => {
                const aDate = new Date(a.published_at || a.created_at).getTime();
                const bDate = new Date(b.published_at || b.created_at).getTime();
                return bDate - aDate;
              });

            const releasesToClean = orderedReleases.slice(keepCount);
            let deletedAssets = 0;

            for (const release of releasesToClean) {
              for (const asset of release.assets || []) {
                const isManagedAsset = patterns.some(pattern => pattern.test(asset.name));
                if (!isManagedAsset) {
                  continue;
                }

                await github.rest.repos.deleteReleaseAsset({
                  owner,
                  repo,
                  asset_id: asset.id
                });
                deletedAssets += 1;
                console.log(`Deleted '${asset.name}' from release '${release.tag_name}'.`);
              }
            }

            console.log(`Pre-clean complete. Assets deleted: ${deletedAssets}.`);

      - name: Compute next release version
        id: get_version
        shell: pwsh
        run: |
          function Parse-SemVerTags {
            param([string[]]$Tags)

            $rows = @()
            foreach ($tag in $Tags) {
              if ($tag -match '^v(\d+)\.(\d+)\.(\d+)$') {
                $rows += [pscustomobject]@{
                  Tag     = $tag
                  Version = [Version]::new([int]$matches[1], [int]$matches[2], [int]$matches[3])
                }
              }
            }

            return $rows
          }

          git fetch --tags --force

          $headVersionRows = Parse-SemVerTags -Tags @(git tag --points-at HEAD "v*.*.*")
          if ($headVersionRows.Count -gt 0) {
            $chosen = $headVersionRows | Sort-Object Version -Descending | Select-Object -First 1
            $version = "$($chosen.Version.Major).$($chosen.Version.Minor).$($chosen.Version.Build)"
            $tagName = $chosen.Tag
            echo "VERSION=$version" >> $env:GITHUB_OUTPUT
            echo "TAG_NAME=$tagName" >> $env:GITHUB_OUTPUT
            echo "Reusing existing tag on HEAD: $tagName"
            exit 0
          }

          $versionRows = Parse-SemVerTags -Tags @(git tag --list "v*.*.*")

          if ($versionRows.Count -eq 0) {
            $next = [Version]::new(0, 1, 0)
          } else {
            $latest = $versionRows | Sort-Object Version -Descending | Select-Object -First 1
            $next = [Version]::new($latest.Version.Major, $latest.Version.Minor, ($latest.Version.Build + 1))
          }

          $version = "$($next.Major).$($next.Minor).$($next.Build)"
          $tagName = "v$version"

          echo "VERSION=$version" >> $env:GITHUB_OUTPUT
          echo "TAG_NAME=$tagName" >> $env:GITHUB_OUTPUT
          echo "Building version: $version (tag $tagName)"

      - name: Restore dependencies
        run: dotnet restore

      - name: Build
        run: dotnet build --configuration Release --no-restore

      - name: Critical Reporting Gate - API Integration
        run: dotnet test tests/FamilyFinances.Api.IntegrationTests/FamilyFinances.Api.IntegrationTests.csproj --configuration Release --no-build --filter "FullyQualifiedName~Reporting"

      - name: Critical Reporting Gate - Web Reports
        run: dotnet test tests/FamilyFinances.Web.Tests/FamilyFinances.Web.Tests.csproj --configuration Release --no-build --filter "FullyQualifiedName~Reports"

      - name: Critical Reporting Gate - Application Reporting
        run: dotnet test tests/FamilyFinances.Application.Tests/FamilyFinances.Application.Tests.csproj --configuration Release --no-build --filter "FullyQualifiedName~Reporting"

      - name: Build installer artifacts
        id: build_installer
        shell: pwsh
        run: |
          $version = "${{ steps.get_version.outputs.VERSION }}"
          $resultJson = ./tools/installer/windows/build-installer.ps1 -Version $version -Configuration Release
          $result = $resultJson | ConvertFrom-Json
          $workspace = (Resolve-Path $env:GITHUB_WORKSPACE).Path

          if (-not (Test-Path $result.InstallerMsi)) {
            throw "MSI installer artifact not found: $($result.InstallerMsi)"
          }

          if (-not (Test-Path $result.InstallerSetupExe)) {
            throw "Setup bootstrapper artifact not found: $($result.InstallerSetupExe)"
          }

          $setupAbsolute = (Resolve-Path $result.InstallerSetupExe).Path
          $msiAbsolute = (Resolve-Path $result.InstallerMsi).Path
          $setupRelative = [System.IO.Path]::GetRelativePath($workspace, $setupAbsolute).Replace('\', '/')
          $msiRelative = [System.IO.Path]::GetRelativePath($workspace, $msiAbsolute).Replace('\', '/')

          Write-Host "Release setup artifact: $setupRelative"
          Write-Host "Release MSI artifact: $msiRelative"

          echo "INSTALLER_SETUP_EXE=$setupRelative" >> $env:GITHUB_OUTPUT
          echo "INSTALLER_MSI=$msiRelative" >> $env:GITHUB_OUTPUT

      - name: Verify release artifact paths
        shell: pwsh
        run: |
          $setup = "${{ steps.build_installer.outputs.INSTALLER_SETUP_EXE }}"
          $msi = "${{ steps.build_installer.outputs.INSTALLER_MSI }}"
          Write-Host "Setup artifact path: $setup"
          Write-Host "MSI artifact path: $msi"

          if (-not (Test-Path $setup)) {
            throw "Setup artifact does not exist: $setup"
          }

          if (-not (Test-Path $msi)) {
            throw "MSI artifact does not exist: $msi"
          }

          Write-Host "Artifacts found. Dist directory snapshot:"
          Get-ChildItem dist -File | Select-Object Name, Length, LastWriteTime

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ steps.get_version.outputs.TAG_NAME }}
          target_commitish: ${{ github.sha }}
          files: |
            ${{ steps.build_installer.outputs.INSTALLER_SETUP_EXE }}
            ${{ steps.build_installer.outputs.INSTALLER_MSI }}
          fail_on_unmatched_files: true
          draft: false
          prerelease: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
