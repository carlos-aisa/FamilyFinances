name: Dependency Review

on:
  pull_request:
    branches: ["main"]

jobs:
  dependency-review:
    if: ${{ !github.event.repository.private }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read

    steps:
      - name: Check dependency graph availability
        id: dependency_graph
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            const response = await github.rest.repos.get({ owner, repo });
            const status = response.data?.security_and_analysis?.dependency_graph?.status;
            const enabled = status === 'enabled';

            core.info(`Dependency Graph status: ${status ?? 'unknown'}`);
            core.setOutput('enabled', enabled ? 'true' : 'false');

      - name: Dependency Review
        if: ${{ steps.dependency_graph.outputs.enabled == 'true' }}
        uses: actions/dependency-review-action@v4

      - name: Dependency Review skipped
        if: ${{ steps.dependency_graph.outputs.enabled != 'true' }}
        run: |
          echo "Dependency Review skipped: Dependency Graph is not enabled for this repository."
