name: CI Quality

on:
  pull_request:
    branches: ["main"]
  push:
    branches: ["main", "develop"]
    paths-ignore:
      - "docs/badges/coverage.svg"

jobs:
  ci-quality:
    runs-on: ubuntu-latest
    outputs:
      coverage_percentage: ${{ steps.coverage.outputs.percentage }}
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "9.0.x"

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --configuration Release --no-restore

      - name: Test with coverage
        run: dotnet test --configuration Release --no-build --collect:"XPlat Code Coverage" --logger "trx;LogFileName=test-results.trx"

      - name: Generate coverage summary
        continue-on-error: true
        shell: bash
        run: |
          dotnet tool install --global dotnet-reportgenerator-globaltool
          export PATH="$PATH:$HOME/.dotnet/tools"
          reportgenerator \
            -reports:"**/TestResults/**/coverage.cobertura.xml" \
            -targetdir:"coveragereport" \
            -reporttypes:"MarkdownSummaryGithub;TextSummary"

          if [ -f "coveragereport/SummaryGithub.md" ]; then
            cat coveragereport/SummaryGithub.md >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Compute coverage percentage
        id: coverage
        shell: bash
        run: |
          python - <<'PY'
          import glob
          import os
          import xml.etree.ElementTree as ET

          report_paths = glob.glob("**/coverage.cobertura.xml", recursive=True)
          total_valid = 0
          total_covered = 0

          for path in report_paths:
              try:
                  root = ET.parse(path).getroot()
              except Exception:
                  continue

              try:
                  total_valid += int(float(root.attrib.get("lines-valid", "0")))
              except Exception:
                  pass

              try:
                  total_covered += int(float(root.attrib.get("lines-covered", "0")))
              except Exception:
                  pass

          percentage = (total_covered / total_valid * 100.0) if total_valid > 0 else 0.0

          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"percentage={percentage:.2f}\n")
              output.write(f"covered={total_covered}\n")
              output.write(f"valid={total_valid}\n")
          PY

      - name: Upload test and coverage artifacts (PR only, best effort)
        if: github.event_name == 'pull_request'
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: ci-quality-results-${{ github.run_id }}
          path: |
            **/TestResults/**/*.trx
            **/TestResults/**/coverage.cobertura.xml
          retention-days: 2
          if-no-files-found: warn
          compression-level: 9

      - name: Add run summary
        shell: bash
        run: |
          {
            echo "## CI Quality"
            echo ""
            echo "- Build and tests completed."
            if [ "${{ github.event_name }}" = "pull_request" ]; then
              echo "- PR run: artifact upload attempted for TRX + coverage (best effort)."
            else
              echo "- Push run: artifact upload skipped to reduce storage usage."
            fi
            echo "- Total line coverage: ${{ steps.coverage.outputs.percentage }}% (${{ steps.coverage.outputs.covered }}/${{ steps.coverage.outputs.valid }} lines)."
            echo "- Coverage summary is included above in this run summary."
          } >> "$GITHUB_STEP_SUMMARY"

  coverage-badge:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: ci-quality
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Generate coverage badge
        shell: bash
        env:
          COVERAGE_PERCENTAGE: ${{ needs.ci-quality.outputs.coverage_percentage }}
        run: |
          python - <<'PY'
          import os

          raw_value = os.environ.get("COVERAGE_PERCENTAGE", "0")
          try:
              percentage = float(raw_value)
          except Exception:
              percentage = 0.0

          if percentage >= 90.0:
              color = "#4c1"
          elif percentage >= 80.0:
              color = "#97CA00"
          elif percentage >= 70.0:
              color = "#dfb317"
          elif percentage >= 60.0:
              color = "#fe7d37"
          else:
              color = "#e05d44"

          label = f"{percentage:.2f}%"

          svg_lines = [
              f'<svg xmlns="http://www.w3.org/2000/svg" width="128" height="20" role="img" aria-label="coverage: {label}">',
              '  <linearGradient id="s" x2="0" y2="100%">',
              '    <stop offset="0" stop-color="#fff" stop-opacity=".7"/>',
              '    <stop offset=".1" stop-color="#aaa" stop-opacity=".1"/>',
              '    <stop offset=".9" stop-color="#000" stop-opacity=".3"/>',
              '    <stop offset="1" stop-color="#000" stop-opacity=".5"/>',
              "  </linearGradient>",
              '  <clipPath id="r">',
              '    <rect width="128" height="20" rx="3" fill="#fff"/>',
              "  </clipPath>",
              '  <g clip-path="url(#r)">',
              '    <rect width="72" height="20" fill="#555"/>',
              f'    <rect x="72" width="56" height="20" fill="{color}"/>',
              '    <rect width="128" height="20" fill="url(#s)"/>',
              "  </g>",
              '  <g fill="#fff" text-anchor="middle" font-family="DejaVu Sans,Verdana,Geneva,sans-serif" font-size="11">',
              '    <text x="36" y="15" fill="#010101" fill-opacity=".3">coverage</text>',
              '    <text x="36" y="14">coverage</text>',
              f'    <text x="100" y="15" fill="#010101" fill-opacity=".3">{label}</text>',
              f'    <text x="100" y="14">{label}</text>',
              "  </g>",
              "</svg>",
          ]
          svg = "\n".join(svg_lines) + "\n"

          os.makedirs("docs/badges", exist_ok=True)
          with open("docs/badges/coverage.svg", "w", encoding="utf-8") as f:
              f.write(svg)
          PY

      - name: Commit coverage badge
        continue-on-error: true
        shell: bash
        run: |
          if [ -z "$(git status --porcelain docs/badges/coverage.svg)" ]; then
            echo "Coverage badge is up to date."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/badges/coverage.svg
          git commit -m "ci: update coverage badge [skip ci]"
          target_branch="${GITHUB_REF#refs/heads/}"
          git push origin "HEAD:${target_branch}"
