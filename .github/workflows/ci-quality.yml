name: CI Quality

on:
  pull_request:
    branches: ["main"]
  push:
    branches: ["main", "develop"]

jobs:
  ci-quality:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "9.0.x"

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --configuration Release --no-restore

      - name: Test with coverage
        run: dotnet test --configuration Release --no-build --collect:"XPlat Code Coverage" --logger "trx;LogFileName=test-results.trx"

      - name: Upload test and coverage artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ci-quality-results
          path: |
            **/TestResults/**/*.trx
            **/TestResults/**/coverage.cobertura.xml
          retention-days: 7

      - name: Add run summary
        shell: bash
        run: |
          {
            echo "## CI Quality"
            echo ""
            echo "- Build and tests completed."
            echo "- Download \`ci-quality-results\` artifact for TRX and coverage files."
            echo "- Coverage output files are published as \`coverage.cobertura.xml\`."
          } >> "$GITHUB_STEP_SUMMARY"
