openapi: 3.0.3
info:
  title: FamilyFinances API
  version: v1
  description: |
    As-built OpenAPI specification for FamilyFinances.

    Scope covered:
    - REST API endpoints hosted by `FamilyFinances.Api` (`/api/v1/...`, `/health`)
    - Session endpoints hosted by `FamilyFinances.Web` (`/auth/session`)

    Notes:
    - Authentication in API endpoints is JWT Bearer-based.
    - Web session endpoints proxy login and manage the `ff_access_token` HttpOnly cookie.
  contact:
    name: FamilyFinances Maintainers
    url: https://github.com/carlos-aisa/FamilyFinances

servers:
  - url: http://localhost:5084
    description: Development API server (`FamilyFinances.Api`) and ZIP production default API endpoint
  - url: https://localhost:7249
    description: Development HTTPS API profile (`FamilyFinances.Api`)

tags:
  - name: Auth
  - name: Accounts
  - name: Payees
  - name: Transactions
  - name: FiscalYears
  - name: History
  - name: AccountGroups
  - name: Reports
  - name: Health
  - name: WebSession

paths:
  /api/v1/ping:
    get:
      tags: [Health]
      summary: Ping endpoint
      description: Returns a simple status payload.
      operationId: Ping_Get
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Successful ping.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PingResponse'
              example:
                status: ok
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /api/v1/auth/login:
    post:
      tags: [Auth]
      summary: Authenticate user
      description: Validates email/password and returns a JWT access token.
      operationId: Auth_Login
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
            example:
              email: admin@familyfinances.local
              password: Admin123!
      responses:
        '200':
          description: Login successful.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccessTokenResponse'
              example:
                accessToken: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/v1/accounts:
    post:
      tags: [Accounts]
      summary: Create account
      operationId: Accounts_Create
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateAccountRequest'
      responses:
        '200':
          description: Account created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountDto'
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          $ref: '#/components/responses/Conflict'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
    get:
      tags: [Accounts]
      summary: List accounts
      operationId: Accounts_List
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Accounts list.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AccountDto'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /api/v1/accounts/balances:
    get:
      tags: [Accounts]
      summary: Get account balances
      operationId: Accounts_GetBalances
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Account balances.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AccountBalanceDto'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /api/v1/accounts/{id}/movements:
    get:
      tags: [Accounts]
      summary: Get account movements
      description: Returns paginated movements and running balances for one account.
      operationId: Accounts_GetMovements
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/AccountIdPath'
        - in: query
          name: from
          required: false
          schema:
            type: string
            format: date
          description: Start date (inclusive). Defaults to first day of current month if omitted.
        - in: query
          name: to
          required: false
          schema:
            type: string
            format: date
          description: End date (exclusive). Defaults to one month after `from` when omitted.
        - in: query
          name: q
          required: false
          schema:
            type: string
          description: Optional text filter over description and payee.
        - in: query
          name: page
          required: false
          schema:
            type: integer
            format: int32
            default: 1
        - in: query
          name: pageSize
          required: false
          schema:
            type: integer
            format: int32
            default: 50
          description: Clamped by server to max 100.
      responses:
        '200':
          description: Account movements.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountMovementsDto'
        '404':
          description: Account not found (response body may be empty in this endpoint).
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /api/v1/accounts/{id}/reconcile:
    post:
      tags: [Accounts]
      summary: Reconcile account
      description: Reconciles account balance by creating adjustment transaction when needed.
      operationId: Accounts_Reconcile
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/AccountIdPath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReconcileAccountRequest'
      responses:
        '200':
          description: Reconciliation result.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReconcileAccountResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          description: Account not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /api/v1/accounts/{id}/rename:
    patch:
      tags: [Accounts]
      summary: Rename account
      operationId: Accounts_Rename
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/AccountIdPath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RenameAccountRequest'
      responses:
        '204':
          description: Account renamed.
        '404':
          description: Account not found (response body may be empty).
        '409':
          $ref: '#/components/responses/Conflict'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /api/v1/accounts/{id}/close:
    patch:
      tags: [Accounts]
      summary: Close account
      operationId: Accounts_Close
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/AccountIdPath'
      responses:
        '204':
          description: Account closed.
        '404':
          description: Account not found (response body may be empty).
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /api/v1/accounts/{id}/reopen:
    patch:
      tags: [Accounts]
      summary: Reopen account
      operationId: Accounts_Reopen
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/AccountIdPath'
      responses:
        '204':
          description: Account reopened.
        '404':
          description: Account not found (response body may be empty).
        '409':
          $ref: '#/components/responses/Conflict'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /api/v1/accounts/{id}:
    delete:
      tags: [Accounts]
      summary: Delete account
      operationId: Accounts_Delete
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/AccountIdPath'
      responses:
        '204':
          description: Account deleted.
        '404':
          description: Account not found (response body may be empty).
        '409':
          $ref: '#/components/responses/Conflict'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /api/v1/payees:
    post:
      tags: [Payees]
      summary: Create payee
      operationId: Payees_Create
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreatePayeeRequest'
      responses:
        '200':
          description: Payee created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PayeeDto'
        '409':
          $ref: '#/components/responses/Conflict'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
    get:
      tags: [Payees]
      summary: List payees
      operationId: Payees_List
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Payees list.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/PayeeDto'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /api/v1/payees/{id}/rename:
    patch:
      tags: [Payees]
      summary: Rename payee
      operationId: Payees_Rename
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/PayeeIdPath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RenamePayeeRequest'
      responses:
        '204':
          description: Payee renamed.
        '404':
          description: Payee not found (response body may be empty).
        '409':
          $ref: '#/components/responses/Conflict'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /api/v1/payees/{id}:
    delete:
      tags: [Payees]
      summary: Delete payee
      operationId: Payees_Delete
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/PayeeIdPath'
      responses:
        '204':
          description: Payee deleted.
        '404':
          description: Payee not found (response body may be empty).
        '409':
          $ref: '#/components/responses/Conflict'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /api/v1/transactions/any:
    get:
      tags: [Transactions]
      summary: Check if any transaction exists
      operationId: Transactions_HasAny
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Presence flag.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HasAnyResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /api/v1/transactions:
    post:
      tags: [Transactions]
      summary: Create transaction
      description: Creates a balanced transaction; can optionally link to a related transaction.
      operationId: Transactions_Create
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateTransactionRequest'
      responses:
        '200':
          description: Transaction created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TransactionDto'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
    get:
      tags: [Transactions]
      summary: List transactions
      operationId: Transactions_List
      security:
        - bearerAuth: []
      parameters:
        - in: query
          name: take
          required: false
          schema:
            type: integer
            format: int32
          description: Maximum number of transactions to return.
      responses:
        '200':
          description: Transactions list.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/TransactionListItemDto'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /api/v1/transactions/{id}:
    get:
      tags: [Transactions]
      summary: Get transaction by id
      operationId: Transactions_GetById
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/TransactionIdPath'
      responses:
        '200':
          description: Transaction found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TransactionDto'
        '404':
          description: Transaction not found (response body may be empty).
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
    put:
      tags: [Transactions]
      summary: Update two-split transaction
      operationId: Transactions_Update
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/TransactionIdPath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateTransactionRequest'
      responses:
        '204':
          description: Transaction updated.
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          description: Transaction not found (response body may be empty).
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalServerError'
    delete:
      tags: [Transactions]
      summary: Delete transaction
      operationId: Transactions_Delete
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/TransactionIdPath'
      responses:
        '204':
          description: Transaction deleted.
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          description: Transaction not found (response body may be empty).
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /api/v1/transactions/{id}/multi-split:
    put:
      tags: [Transactions]
      summary: Update multi-split transaction
      operationId: Transactions_UpdateMultiSplit
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/TransactionIdPath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateMultiSplitTransactionRequest'
      responses:
        '204':
          description: Transaction updated.
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          description: Transaction not found (response body may be empty).
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /api/v1/transactions/search-expenses:
    get:
      tags: [Transactions]
      summary: Search expense transactions
      operationId: Transactions_SearchExpenses
      security:
        - bearerAuth: []
      parameters:
        - in: query
          name: q
          required: true
          schema:
            type: string
          description: Search text.
        - in: query
          name: expenseAccountId
          required: false
          schema:
            type: string
            format: uuid
        - in: query
          name: limit
          required: false
          schema:
            type: integer
            format: int32
            default: 20
          description: Requested maximum results (server caps at 50).
      responses:
        '200':
          description: Matching expense transactions.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ExpenseSearchResultDto'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /api/v1/fiscal-years:
    get:
      tags: [FiscalYears]
      summary: List fiscal year statuses
      operationId: FiscalYears_List
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Fiscal-year statuses.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/FiscalYearStatusDto'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /api/v1/fiscal-years/{year}/close:
    post:
      tags: [FiscalYears]
      summary: Close fiscal year
      description: Closes the fiscal year and computes account snapshots for year end.
      operationId: FiscalYears_Close
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: year
          required: true
          schema:
            type: integer
            format: int32
      responses:
        '200':
          description: Fiscal year closed (idempotent if already closed).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FiscalYearStatusDto'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /api/v1/fiscal-years/{year}/reopen:
    post:
      tags: [FiscalYears]
      summary: Reopen fiscal year
      description: Reopens the fiscal year and removes stale snapshots for that year.
      operationId: FiscalYears_Reopen
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: year
          required: true
          schema:
            type: integer
            format: int32
      responses:
        '200':
          description: Fiscal year reopened (idempotent if already open).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FiscalYearStatusDto'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /api/v1/history/transactions:
    get:
      tags: [History]
      summary: List historical transactions by year
      operationId: History_ListTransactions
      security:
        - bearerAuth: []
      parameters:
        - in: query
          name: year
          required: true
          schema:
            type: integer
            format: int32
        - in: query
          name: take
          required: false
          schema:
            type: integer
            format: int32
            default: 200
          description: Requested maximum items (server caps at 1000).
      responses:
        '200':
          description: Historical transactions for selected year.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/TransactionListItemDto'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /api/v1/history/movements:
    get:
      tags: [History]
      summary: Get historical account movements by year
      operationId: History_GetMovements
      security:
        - bearerAuth: []
      parameters:
        - in: query
          name: accountId
          required: true
          schema:
            type: string
            format: uuid
        - in: query
          name: year
          required: true
          schema:
            type: integer
            format: int32
        - in: query
          name: q
          required: false
          schema:
            type: string
          description: Optional text filter over description and payee.
        - in: query
          name: page
          required: false
          schema:
            type: integer
            format: int32
            default: 1
        - in: query
          name: pageSize
          required: false
          schema:
            type: integer
            format: int32
            default: 50
          description: Clamped by server to max 100.
      responses:
        '200':
          description: Historical movements for account and year.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountMovementsDto'
        '404':
          description: Account not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /api/v1/account-groups:
    post:
      tags: [AccountGroups]
      summary: Create account group
      operationId: AccountGroups_Create
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateAccountGroupRequest'
      responses:
        '200':
          description: Account group created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountGroupDto'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
    get:
      tags: [AccountGroups]
      summary: List account groups
      operationId: AccountGroups_List
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Account groups list.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AccountGroupDto'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /api/v1/account-groups/{id}:
    get:
      tags: [AccountGroups]
      summary: Get account group by id
      operationId: AccountGroups_GetById
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/GroupIdPath'
      responses:
        '200':
          description: Account group details.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountGroupDetailsDto'
        '404':
          description: Account group not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
    delete:
      tags: [AccountGroups]
      summary: Delete account group
      operationId: AccountGroups_Delete
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/GroupIdPath'
      responses:
        '204':
          description: Account group deleted.
        '404':
          description: Account group not found (response body may be empty).
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /api/v1/account-groups/{id}/accounts/{accountId}:
    post:
      tags: [AccountGroups]
      summary: Add account to group
      operationId: AccountGroups_AddAccount
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/GroupIdPath'
        - $ref: '#/components/parameters/AccountIdPath2'
      responses:
        '204':
          description: Membership added (idempotent if already present).
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalServerError'
    delete:
      tags: [AccountGroups]
      summary: Remove account from group
      operationId: AccountGroups_RemoveAccount
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/GroupIdPath'
        - $ref: '#/components/parameters/AccountIdPath2'
      responses:
        '204':
          description: Membership removed (idempotent).
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /api/v1/account-groups/{id}/rename:
