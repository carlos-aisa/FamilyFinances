          nullable: true
      required: [actualBalance, asOfDate]

    ReconcileAccountResponse:
      type: object
      properties:
        adjustmentCreated:
          type: boolean
        transactionId:
          type: string
          format: uuid
          nullable: true
        computedBalance:
          type: number
        actualBalance:
          type: number
        difference:
          type: number
        message:
          type: string
      required: [adjustmentCreated, transactionId, computedBalance, actualBalance, difference, message]

    AccountDto:
