  /health:
    get:
      tags: [Health]
      summary: Health check
      description: Health checks endpoint. Exact payload contract is not explicitly defined in code.
      operationId: Health_Get
      security: []
      responses:
        '200':
          description: Healthy response (body contract UNKNOWN).
        '503':
          description: Unhealthy response (body contract UNKNOWN).

  /auth/session:
    servers:
      - url: http://localhost:5019
        description: Development web host (`FamilyFinances.Web`) and ZIP production default web endpoint
      - url: https://localhost:7143
        description: Development HTTPS web profile (`FamilyFinances.Web`)
    post:
      tags: [WebSession]
      summary: Create web session
      description: |
        Proxies credentials to API login endpoint, then stores token in `ff_access_token` HttpOnly cookie.
      operationId: WebSession_Login
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Session established.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccessTokenResponse'
        '400':
          description: Invalid login request payload.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Upstream API rejected credentials.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '500':
          description: Session endpoint internal error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        default:
          description: Upstream authentication failure or unexpected session error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
    get:
      tags: [WebSession]
      summary: Get web session token
      operationId: WebSession_Get
      security: []
      responses:
        '200':
          description: Session token exists.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccessTokenResponse'
        '204':
          description: No session token cookie found.
    delete:
      tags: [WebSession]
      summary: Delete web session
      operationId: WebSession_Logout
      security: []
      responses:
        '200':
          description: Session cookie removed.

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
    cookieToken:
      type: apiKey
      in: cookie
      name: ff_access_token
      description: Token cookie used by the web host session flow.

  parameters:
    AccountIdPath:
      in: path
      name: id
      required: true
      schema:
        type: string
        format: uuid
    AccountIdPath2:
      in: path
      name: accountId
      required: true
      schema:
        type: string
        format: uuid
    PayeeIdPath:
      in: path
      name: id
      required: true
      schema:
        type: string
        format: uuid
    TransactionIdPath:
      in: path
      name: id
      required: true
      schema:
        type: string
        format: uuid
    GroupIdPath:
      in: path
      name: id
      required: true
      schema:
        type: string
        format: uuid

  responses:
    Unauthorized:
      description: Unauthorized.
    Forbidden:
      description: Forbidden.
    BadRequest:
      description: Bad request.
      content:
        application/json:
          schema:
            oneOf:
              - $ref: '#/components/schemas/ErrorResponse'
              - $ref: '#/components/schemas/ProblemDetails'
    Conflict:
      description: Conflict.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    InternalServerError:
      description: Unexpected server error (response body contract may be empty or framework-defined).

  schemas:
    UnknownObject:
      type: object
      additionalProperties: true
      description: Payload contract is not explicitly defined by code.

    ErrorResponse:
      type: object
      properties:
        error:
          type: string
      required: [error]

    ProblemDetails:
      type: object
      description: RFC 7807 problem details payload.
      properties:
        type:
          type: string
          nullable: true
        title:
          type: string
          nullable: true
        status:
          type: integer
          format: int32
          nullable: true
        detail:
          type: string
          nullable: true
        instance:
          type: string
          nullable: true
      additionalProperties: true

    PingResponse:
      type: object
      properties:
        status:
          type: string
      required: [status]

    HasAnyResponse:
      type: object
      properties:
        hasAny:
          type: boolean
      required: [hasAny]

    AccessTokenResponse:
      type: object
      properties:
        accessToken:
          type: string
      required: [accessToken]

    LoginRequest:
      type: object
      properties:
        email:
          type: string
        password:
          type: string
      required: [email, password]

    AccountNature:
      type: integer
      format: int32
      enum: [1, 2, 3, 4, 5]
      description: 'Numeric enum: 1=Asset, 2=Liability, 3=Income, 4=Expense, 5=Equity.'

    AccountKind:
      type: integer
      format: int32
      enum: [1, 2, 3, 4, 5, 6, 7, 8, 9, 99]
      description: 'Numeric enum: 1=Checking, 2=Savings, 3=CreditCard, 4=Cash, 5=Investment, 6=ExpenseCategory, 7=IncomeSource, 8=Mortgage, 9=Loan, 99=Other.'

    TransactionListItemType:
      type: integer
      format: int32
      enum: [0, 1, 2, 3, 4]
      description: 'Numeric enum: 0=Expense, 1=Income, 2=Transfer, 3=Refund, 4=Other.'

    MonthlyEvolutionScope:
      type: integer
      format: int32
      enum: [1, 2, 3]
      description: 'Numeric enum: 1=Accounts, 2=AssetTotal, 3=AccountGroups.'

    MonthlyEvolutionScopeQuery:
      type: string
      enum: [accounts, asset-total, account-groups]
      description: Scope selector for monthly evolution endpoint.

    CreateAccountRequest:
      type: object
      properties:
        name:
          type: string
        nature:
          $ref: '#/components/schemas/AccountNature'
        kind:
          $ref: '#/components/schemas/AccountKind'
        openedOn:
          type: string
          format: date
      required: [name, nature, kind, openedOn]

    RenameAccountRequest:
      type: object
      properties:
        name:
